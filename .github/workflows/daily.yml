name: Viral Ideas Engine

on:
  schedule:
    # 03:00 UTC and 15:00 UTC = twice daily (~07:00 and 19:00 Morocco)
    - cron: '0 3,15 * * *'
  workflow_dispatch:

concurrency:
  group: viral-engine
  cancel-in-progress: false

jobs:
  research-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Browse The Web (research)
        run: |
          python content-engine/research.py

      - name: Generate Viral Pack + Voiceover
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python content-engine/generate.py

      - name: Commit Pack
        run: |
          git config --global user.name "nexus-viral"
          git config --global user.email "viral@users.noreply.github.com"
          git add research/ feed/
          git status
          if ! git diff-index --quiet HEAD; then
            git commit -m "content: viral pack + voiceover [skip ci]"
          fi
          git push || (git pull --rebase --autostash && git push)
